<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAC Games</title>
    <meta name="description" content="Picture games for people who can only click." />
    <meta name="theme-color" content="#1f2430" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Start screen: language and a menu of games. Text comes from js/i18n.js via data-i18n. -->
    <section id="start-screen" class="start-screen">
      <div id="language-switch" class="language-switch" role="group" aria-label="Language / ენა / Язык"></div>
      <h1 data-i18n="title"></h1>
      <p class="hint" data-i18n="chooseGame"></p>
      <div id="game-menu" class="game-menu"></div>
    </section>

    <!-- Intro screen for the chosen game: Start and settings. -->
    <section id="intro-screen" class="intro-screen" hidden>
      <button id="back-button" class="back-button" type="button">‹ <span data-i18n="back"></span></button>
      <img id="intro-icon" class="intro-icon" alt="" draggable="false" />
      <p id="intro-category" class="intro-category"></p>
      <h2 id="intro-name" class="intro-name"></h2>
      <button id="start-button" class="start-button" type="button" data-i18n="start"></button>
      <p id="intro-help" class="hint"></p>
      <p class="hint" data-i18n="escHint"></p>
      <p id="voice-status" class="voice-status" hidden>
        <span id="voice-status-text"></span>
        <button id="voice-retry" class="link-button" type="button" data-i18n="retry" hidden></button>
      </p>

      <details id="settings" class="settings">
        <summary id="settings-summary" data-i18n="settings"></summary>
        <form id="settings-form" class="settings-form">
          <fieldset data-category="guess">
            <legend data-i18n="categories.guess.name"></legend>
            <label>
              <span data-i18n="choicesPerRound"></span>
              <select name="choicesPerRound">
                <option value="2">2</option>
                <option value="4">4</option>
              </select>
            </label>
            <label>
              <span data-i18n="choiceInput"></span>
              <select name="choiceInput">
                <option value="scan" data-i18n="choiceInputScan"></option>
                <option value="touch" data-i18n="choiceInputTouch"></option>
              </select>
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="timing"></legend>
            <label>
              <span data-i18n="intervalBefore"></span>
              <span class="field">
                <input name="intervalMs" type="number" min="0.5" max="10" step="0.1" data-scale="1000" />
                <span data-i18n="intervalAfter"></span>
              </span>
            </label>
            <label>
              <span data-i18n="cooldownBefore"></span>
              <span class="field">
                <input name="cooldownMs" type="number" min="0" max="10" step="0.1" data-scale="1000" />
                <span data-i18n="cooldownAfter"></span>
              </span>
            </label>
            <label>
              <span data-i18n="debounceBefore"></span>
              <span class="field">
                <input name="debounceMs" type="number" min="0" max="2" step="0.05" data-scale="1000" />
                <span data-i18n="debounceAfter"></span>
              </span>
            </label>
            <label>
              <span data-i18n="maxCyclesBefore"></span>
              <span class="field">
                <input name="maxCycles" type="number" min="0" max="50" step="1" />
                <span data-i18n="maxCyclesAfter"></span>
              </span>
            </label>
          </fieldset>

          <fieldset>
            <legend data-i18n="sound"></legend>
            <label class="check"><input name="speakOnSelect" type="checkbox" /> <span data-i18n="speakOnSelect"></span></label>
            <label class="check"><input name="speakOnHighlight" type="checkbox" /> <span data-i18n="speakOnHighlight"></span></label>
            <label class="check"><input name="highlightSound" type="checkbox" /> <span data-i18n="highlightSound"></span></label>
            <label>
              <span data-i18n="voice"></span>
              <!-- Bound to voiceEn / voiceKa depending on the language, see main.js. -->
              <select id="voice-select"></select>
            </label>
            <p id="speech-note" class="note" hidden></p>
            <p id="voice-license" class="note-muted" hidden></p>
          </fieldset>

          <fieldset>
            <legend data-i18n="display"></legend>
            <label class="check"><input name="fullscreen" type="checkbox" /> <span data-i18n="fullscreen"></span></label>
          </fieldset>
        </form>
      </details>
    </section>

    <!-- Game screen: the running game fills #game-root. A click anywhere on
         it counts as a press. -->
    <section id="game-screen" class="game-screen" hidden>
      <div id="game-root" class="game-root"></div>
      <!-- Back to the game's page. Games include it in their scan; a direct
           click works too. -->
      <div class="game-bar">
        <button id="game-back" class="back-button" type="button">‹ <span data-i18n="back"></span></button>
        <button id="game-restart" class="restart-button" type="button">↻ <span data-i18n="restart"></span></button>
        <!-- Games put their own tap-only buttons here (e.g. page arrows). -->
        <div id="game-controls" class="game-controls"></div>
      </div>
    </section>

    <noscript>This app needs JavaScript enabled. / აპლიკაციას JavaScript სჭირდება.</noscript>
  </body>
</html>
